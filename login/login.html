<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouOmni Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 22px;
    }

    .block {
      border: 1px solid #3a3a3a;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #181818;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2a2a2a;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: #4a90e2;
      color: white;
    }

    .message {
      font-size: 14px;
      text-align: center;
      color: #aaa;
      margin: 0;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>LOG IN</h1>

    <div class="block">
      <p class="message">Enter your purchase email to receive a magic sign-in link.</p>
      <input id="email" type="email" placeholder="Email" />
      <button id="send-link-btn">Send Sign-In Link</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getAuth, 
    sendSignInLinkToEmail, 
    isSignInWithEmailLink, 
    signInWithEmailLink 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAwXP9KUEUdiu0836CE20HCX-lBrGmiqjI",
    authDomain: "youomni-7d0d6.firebaseapp.com",
    projectId: "youomni-7d0d6",
    storageBucket: "youomni-7d0d6.firebasestorage.app",
    messagingSenderId: "604663505682",
    appId: "1:604663505682:web:4132d3f7f5c908b31409cb"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect");
    window.location.href = redirect || "/index.html";
  }

  // 1. Pre-fill email field automatically if provided via URL (Stripe/Paddle redirect)
  const urlParams = new URLSearchParams(window.location.search);
  const customerEmail = urlParams.get("email");
  if (customerEmail) {
    document.getElementById("email").value = customerEmail;
  }

  // 2. Handle incoming sign-in link completion
  if (isSignInWithEmailLink(auth, window.location.href)) {
    let email = window.localStorage.getItem("emailForSignIn");
    if (!email) {
      email = window.prompt("Please confirm your email address to complete sign-in:");
    }
    if (email) {
      signInWithEmailLink(auth, email, window.location.href)
        .then(() => {
          window.localStorage.removeItem("emailForSignIn");
          redirectAfterLogin();
        })
        .catch((error) => {
          alert("Sign-in failed: " + error.message);
        });
    }
  }

  // 3. Send sign-in link
  document.getElementById("send-link-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
      alert("Please enter your email");
      return;
    }

    const actionCodeSettings = {
      url: "https://youomni.github.io/login/login.html",
      handleCodeInApp: true
    };

    try {
      await sendSignInLinkToEmail(auth, email, actionCodeSettings);
      window.localStorage.setItem("emailForSignIn", email);
      alert("Sign-in link sent! Check your inbox.");
    } catch (error) {
      alert("Failed to send link: " + error.message);
    }
  });
</script>

</body>
</html>
