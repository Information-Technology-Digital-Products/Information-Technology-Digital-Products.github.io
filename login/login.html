<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Course Platform</title>

  <style>
    /* Force browser color scheme lock */
    :root {
      color-scheme: normal !important;
    }

    /* Base setup forcing exact colors in all media schemes */
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #311b92 !important;
      color: #ffffff !important;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Force identical styles on system light and dark themes */
    @media (prefers-color-scheme: light), (prefers-color-scheme: dark) {
      html, body {
        background-color: #311b92 !important;
        color: #ffffff !important;
      }

      .container {
        background-color: #1c1c1c !important;
        color: #ffffff !important;
      }

      .auth-card {
        background-color: #141414 !important;
        border-color: #333333 !important;
      }

      .block {
        background-color: #181818 !important;
        border-color: #808080 !important;
      }

      input {
        background-color: #2a2a2a !important;
        color: #ffffff !important;
        border-color: #3a3a3a !important;
      }

      button.primary, button.google {
        background-color: #0284c7 !important;
        color: #ffffff !important;
      }

      label, .helper-text {
        color: #94a3b8 !important;
      }
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 28px;
      background-color: #1c1c1c !important;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.5px;
      color: #ffffff !important;
    }

    .auth-card {
      border: 1px solid #333333 !important;
      border-radius: 12px;
      padding: 20px;
      background-color: #141414 !important;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }

    .block {
      border: 1px solid #808080 !important;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #181818 !important;
      box-sizing: border-box;
      min-height: 150px;
      justify-content: center;
    }

    label, .helper-text {
      display: block;
      font-size: 1rem;
      color: #94a3b8 !important;
      margin: 0;
    }

    .helper-text {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #3a3a3a !important;
      border-radius: 8px;
      background-color: #2a2a2a !important;
      color: #ffffff !important;
      box-sizing: border-box;
      font-size: 1rem;
      -webkit-appearance: none;
      appearance: none;
    }

    /* Fix chrome/safari autofill theme overrides */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff !important;
      -webkit-box-shadow: 0 0 0px 1000px #2a2a2a inset !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    input:focus {
      outline: none;
      border-color: #4a90e2 !important;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: background-color 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .primary, .google {
      background-color: #0284c7 !important;
      color: #ffffff !important;
    }

    .primary:hover, .google:hover {
      background-color: #0369a1 !important;
    }

    .error-message {
      color: #ef4444 !important;
      font-size: 1rem;
      text-align: center;
      min-height: 1.2em;
      visibility: hidden;
      margin: 0;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>LOG IN</h1>

    <div class="auth-card">
      <!-- Option 1: Email Entry / OTP Verification -->
      <div id="emailBlock" class="block">
        <!-- Step 1: Purchase Email Entry -->
        <div id="step1" style="display: flex; flex-direction: column; gap: 12px;">
          <label for="email">Enter your Purchase Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
          <button id="sendOtpBtn" class="primary">Get Login Code</button>
        </div>

        <!-- Step 2: Login Code Entry -->
        <div id="step2" style="display: none; flex-direction: column; gap: 12px;">
          <label for="otp">Enter your 6-digit Login Code</label>
          <input type="text" id="otp" placeholder="123456" maxlength="6" />
          <button id="verifyOtpBtn" class="primary">Log In</button>
        </div>
      </div>

      <h1 id="dividerBlock">OR</h1>

      <!-- Option 2: Google Sign-In -->
      <div id="googleBlock" class="block">
        <button id="googleBtn" class="google">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" style="width: 18px; height: 18px;" />
          Log in with Google
        </button>
        <p class="helper-text">Use the Google account<br/>associated with your<br/>Purchase Email</p>
      </div>
    </div>

    <div id="errMsg" class="error-message">&nbsp;</div>
  </div>

<script type="module">
  import { requestOTP, verifyOTPAndLogin, loginWithGoogle } from "./auth.js";

  const EMAIL_INPUT = document.getElementById("email");
  const OTP_INPUT = document.getElementById("otp");
  const SEND_OTP_BTN = document.getElementById("sendOtpBtn");
  const VERIFY_OTP_BTN = document.getElementById("verifyOtpBtn");
  const GOOGLE_BTN = document.getElementById("googleBtn");
  const STEP1 = document.getElementById("step1");
  const STEP2 = document.getElementById("step2");
  const ERR_MSG = document.getElementById("errMsg");

  function showError(msg) {
    ERR_MSG.innerText = msg;
    ERR_MSG.style.visibility = "visible";
  }

  function clearError() {
    ERR_MSG.innerHTML = "&nbsp;";
    ERR_MSG.style.visibility = "hidden";
  }

  function redirectAfterLogin() {
    const PARAMS = new URLSearchParams(window.location.search);
    const REDIRECT = PARAMS.get("redirect");
    window.location.href = REDIRECT || "/lesson1/lesson1.html";
  }

  GOOGLE_BTN.addEventListener("click", async () => {
    clearError();
    try {
      GOOGLE_BTN.disabled = true;
      await loginWithGoogle();
      redirectAfterLogin();
    } catch (err) {
      showError(err.message);
      GOOGLE_BTN.disabled = false;
    }
  });

  SEND_OTP_BTN.addEventListener("click", async () => {
    clearError();
    const EMAIL = EMAIL_INPUT.value.trim();
    if (!EMAIL) {
      showError("Please Enter your Purchase Email");
      return;
    }

    try {
      SEND_OTP_BTN.disabled = true;
      SEND_OTP_BTN.innerText = "Sending Login Code...";
      await requestOTP(EMAIL);
      
      STEP1.style.display = "none";
      STEP2.style.display = "flex";
      OTP_INPUT.focus();
    } catch (err) {
      showError(err.message);
    } finally {
      SEND_OTP_BTN.disabled = false;
      SEND_OTP_BTN.innerText = "Get Login Code";
    }
  });

  VERIFY_OTP_BTN.addEventListener("click", async () => {
    clearError();
    const EMAIL = EMAIL_INPUT.value.trim();
    const OTP = OTP_INPUT.value.trim();

    if (!OTP || OTP.length !== 6) {
      showError("Please Enter your 6-digit Login Code");
      return;
    }

    try {
      VERIFY_OTP_BTN.disabled = true;
      VERIFY_OTP_BTN.innerText = "Logging in...";
      await verifyOTPAndLogin(EMAIL, OTP);
      redirectAfterLogin();
    } catch (err) {
      showError(err.message);
      VERIFY_OTP_BTN.disabled = false;
      VERIFY_OTP_BTN.innerText = "Log In";
    }
  });
</script>

</body>
</html>
