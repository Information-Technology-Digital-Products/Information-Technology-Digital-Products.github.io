<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouOmni Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 22px;
    }

    .block {
      border: 1px solid #3a3a3a;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #181818;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2a2a2a;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #4a90e2;
      color: white;
    }

    .google {
      background: white;
      color: black;
    }

    .or {
      text-align: center;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Log In</h1>

  <div class="block">
    <button id="google-btn" class="google">Log in with Google</button>
  </div>

  <h1>OR</h1>

  <div class="block">
    <button id="email-btn" class="primary">Log In with any Email</button>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithPopup, 
    GoogleAuthProvider,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDynBXFEWiPQn1ggxgzCsSocnHPXCOnhd8",
    authDomain: "youomni-7e3b8.firebaseapp.com",
    projectId: "youomni-7e3b8",
    storageBucket: "youomni-7e3b8.firebasestorage.app",
    messagingSenderId: "349979735697",
    appId: "1:349979735697:web:aa49de6fdd07b40cdff130",
    measurementId: "G-C1GVBRZZN3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect");
    window.location.href = redirect || "/index.html";
  }

  // Google Sign-In
  document.getElementById("google-btn").addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, provider);
      redirectAfterLogin();
    } catch (error) {
      console.error("Google Auth Error:", error);
      alert("Google login failed: " + error.message);
    }
  });

  // Email + Password Login / Auto Registration
  document.getElementById("email-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Enter email and password");
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, password);
      redirectAfterLogin();
    } catch (error) {
      if (error.code === "auth/user-not-found" || error.code === "auth/invalid-credential") {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          redirectAfterLogin();
        } catch (signupError) {
          console.error("Signup Error:", signupError);
          alert("Authentication failed: " + signupError.message);
        }
      } else {
        console.error("Login Error:", error);
        alert("Login failed: " + error.message);
      }
    }
  });
</script>

</body>
</html>
