<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Course Platform</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 450px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    .block {
      border: 1px solid gray;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #181818;
      box-sizing: border-box;
      min-height: 135px; /* Fixed height matching both states to prevent layout shifts */
      justify-content: center;
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .helper-text {
      font-size: 0.875rem;
      color: #94a3b8;
      margin: 0;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #2a2a2a;
      color: #ffffff;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #4a90e2;
    }

    button {
      width: 100%;
      padding: 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .primary {
      background: #0284c7;
      color: #ffffff;
    }

    .primary:hover {
      background: #0369a1;
    }

    .google {
      background: #ffffff;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google:hover {
      background: #f1f5f9;
    }

    .error-message {
      color: #ef4444;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>LOG IN</h1>

    <!-- Option 1: Email Entry / OTP Verification (replaces in-place without layout shift) -->
    <div id="emailBlock" class="block">
      <!-- Step 1: Purchase Email Entry -->
      <div id="step1" style="display: flex; flex-direction: column; gap: 10px;">
        <label for="email">Purchase Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
        <button id="sendOtpBtn" class="primary">Send Login Code</button>
      </div>

      <!-- Step 2: Login Code Entry (Identical size) -->
      <div id="step2" style="display: none; flex-direction: column; gap: 10px;">
        <label for="otp">Enter 6-Digit Login Code</label>
        <input type="text" id="otp" placeholder="123456" maxlength="6" />
        <button id="verifyOtpBtn" class="primary">Log In</button>
      </div>
    </div>

    <h1 id="dividerBlock">OR</h1>

    <!-- Option 2: Google Sign-In -->
    <div id="googleBlock" class="block">
      <p class="helper-text">If your Purchase Email is a Google Email</p>
      <button id="googleBtn" class="google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" style="width: 18px; height: 18px;" />
        Log in with Google
      </button>
    </div>

    <div id="errMsg" class="error-message"></div>
  </div>

<script type="module">
  import { requestOTP, verifyOTPAndLogin, loginWithGoogle } from "./auth.js";

  const EMAIL_INPUT = document.getElementById("email");
  const OTP_INPUT = document.getElementById("otp");
  const SEND_OTP_BTN = document.getElementById("sendOtpBtn");
  const VERIFY_OTP_BTN = document.getElementById("verifyOtpBtn");
  const GOOGLE_BTN = document.getElementById("googleBtn");
  const STEP1 = document.getElementById("step1");
  const STEP2 = document.getElementById("step2");
  const ERR_MSG = document.getElementById("errMsg");

  function showError(msg) {
    ERR_MSG.innerText = msg;
    ERR_MSG.style.display = "block";
  }

  function clearError() {
    ERR_MSG.innerText = "";
    ERR_MSG.style.display = "none";
  }

  function redirectAfterLogin() {
    const PARAMS = new URLSearchParams(window.location.search);
    const REDIRECT = PARAMS.get("redirect");
    window.location.href = REDIRECT || "/lesson1/lesson1.html";
  }

  GOOGLE_BTN.addEventListener("click", async () => {
    clearError();
    try {
      GOOGLE_BTN.disabled = true;
      await loginWithGoogle();
      redirectAfterLogin();
    } catch (err) {
      showError(err.message);
      GOOGLE_BTN.disabled = false;
    }
  });

  SEND_OTP_BTN.addEventListener("click", async () => {
    clearError();
    const EMAIL = EMAIL_INPUT.value.trim();
    if (!EMAIL) {
      showError("Please enter your purchase email");
      return;
    }

    try {
      SEND_OTP_BTN.disabled = true;
      SEND_OTP_BTN.innerText = "Sending Login Code...";
      await requestOTP(EMAIL);
      
      STEP1.style.display = "none";
      STEP2.style.display = "flex";
      OTP_INPUT.focus();
    } catch (err) {
      showError(err.message);
    } finally {
      SEND_OTP_BTN.disabled = false;
      SEND_OTP_BTN.innerText = "Send Login Code";
    }
  });

  VERIFY_OTP_BTN.addEventListener("click", async () => {
    clearError();
    const EMAIL = EMAIL_INPUT.value.trim();
    const OTP = OTP_INPUT.value.trim();

    if (!OTP || OTP.length !== 6) {
      showError("Please enter your 6-digit Login Code.");
      return;
    }

    try {
      VERIFY_OTP_BTN.disabled = true;
      VERIFY_OTP_BTN.innerText = "Logging in...";
      await verifyOTPAndLogin(EMAIL, OTP);
      redirectAfterLogin();
    } catch (err) {
      showError(err.message);
      VERIFY_OTP_BTN.disabled = false;
      VERIFY_OTP_BTN.innerText = "Log In";
    }
  });
</script>

</body>
</html>
