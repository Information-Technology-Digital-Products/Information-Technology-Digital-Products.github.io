<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Course Platform</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 360px;
    }
    .login-card h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }
    .helper-text {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-top: 0;
      margin-bottom: 0.75rem;
    }
    .sent-notice {
      font-size: 0.75rem;
      color: #94a3b8;
      margin: -0.25rem 0 0.75rem 0;
    }
    .change-email-btn {
      background: none;
      border: none;
      color: #38bdf8;
      padding: 0;
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      width: auto;
      display: inline;
    }
    .change-email-btn:hover {
      background: none;
      color: #7dd3fc;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 4px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      box-sizing: border-box;
      margin-bottom: 0.5rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 4px;
      border: none;
      background-color: #0284c7;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0369a1;
    }
    .google-btn {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 0.25rem;
    }
    .google-btn:hover {
      background-color: #f1f5f9;
    }
    .divider {
      text-align: center;
      color: #64748b;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    .error-message {
      color: #ef4444;
      font-size: 0.875rem;
      margin-top: 0.5rem;
      display: none;
    }
    .step-2 {
      display: none;
    }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Login</h2>

  <div id="step1" class="form-group">
    <label for="email">Purchase Email</label>
    <input type="email" id="email" placeholder="you@example.com">
    <button id="sendOtpBtn">Send Login Code</button>

    <div class="divider">— OR —</div>
    <p class="helper-text">If your Purchase Email is a Google Email</p>

    <button id="googleBtn" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" style="width: 18px; height: 18px;">
      Log in with Google
    </button>
  </div>

  <div id="step2" class="form-group step-2">
    <label for="otp">Enter 6-Digit Login Code</label>
    <div class="sent-notice">
      Sent to <span id="sentEmailDisplay" style="color: #f8fafc;"></span> 
      (<button type="button" id="changeEmailBtn" class="change-email-btn">Change</button>)
    </div>
    <input type="text" id="otp" placeholder="123456" maxlength="6">
    <button id="verifyOtpBtn">Log In</button>
  </div>

  <div id="errMsg" class="error-message"></div>
</div>

<script type="module">
  import { requestOTP, verifyOTPAndLogin, loginWithGoogle } from "./auth.js";

  const EMAIL_INPUT = document.getElementById("email");
  const OTP_INPUT = document.getElementById("otp");
  const SEND_OTP_BTN = document.getElementById("sendOtpBtn");
  const VERIFY_OTP_BTN = document.getElementById("verifyOtpBtn");
  const GOOGLE_BTN = document.getElementById("googleBtn");
  const STEP1 = document.getElementById("step1");
  const STEP2 = document.getElementById("step2");
  const ERR_MSG = document.getElementById("errMsg");
  const SENT_EMAIL_DISPLAY = document.getElementById("sentEmailDisplay");
  const CHANGE_EMAIL_BTN = document.getElementById("changeEmailBtn");

  function showError(msg) {
    ERR_MSG.innerText = msg;
    ERR_MSG.style.display = "block";
  }

  function clearError() {
    ERR_MSG.innerText = "";
    ERR_MSG.style.display = "none";
  }

  GOOGLE_BTN.addEventListener("click", async () => {
    clearError();
    try {
      GOOGLE_BTN.disabled = true;
      await loginWithGoogle();
    } catch (err) {
      showError(err.message);
      GOOGLE_BTN.disabled = false;
    }
  });

  SEND_OTP_BTN.addEventListener("click", async () => {
    clearError();
    const email = EMAIL_INPUT.value.trim();
    if (!email) {
      showError("Please enter your purchase email");
      return;
    }

    try {
      SEND_OTP_BTN.disabled = true;
      SEND_OTP_BTN.innerText = "Sending Login Code...";
      await requestOTP(email);
      
      SENT_EMAIL_DISPLAY.innerText = email;
      STEP1.style.display = "none";
      STEP2.style.display = "block";
      OTP_INPUT.focus();
    } catch (err) {
      showError(err.message);
    } finally {
      SEND_OTP_BTN.disabled = false;
      SEND_OTP_BTN.innerText = "Send Login Code";
    }
  });

  CHANGE_EMAIL_BTN.addEventListener("click", () => {
    clearError();
    OTP_INPUT.value = "";
    STEP2.style.display = "none";
    STEP1.style.display = "block";
    EMAIL_INPUT.focus();
  });

  VERIFY_OTP_BTN.addEventListener("click", async () => {
    clearError();
    const email = EMAIL_INPUT.value.trim();
    const otp = OTP_INPUT.value.trim();

    if (!otp || otp.length !== 6) {
      showError("Please enter your 6-digit Login Code.");
      return;
    }

    try {
      VERIFY_OTP_BTN.disabled = true;
      VERIFY_OTP_BTN.innerText = "Logging in...";
      await verifyOTPAndLogin(email, otp);
    } catch (err) {
      showError(err.message);
      VERIFY_OTP_BTN.disabled = false;
      VERIFY_OTP_BTN.innerText = "Log In";
    }
  });
</script>

</body>
</html>
