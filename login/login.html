<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-card">
    <h2>Access Platform</h2>

    <div class="input-group">
      <label for="emailInput">Email Address</label>
      <input type="email" id="emailInput" placeholder="name@example.com" required>
    </div>

    <div class="input-group" id="otpGroup" style="display: none;">
      <label for="otpInput">Enter 6-Digit OTP</label>
      <input type="text" id="otpInput" placeholder="123456" maxlength="6">
    </div>

    <p id="errorMessage" class="error-msg" style="display: none;"></p>

    <button id="mainBtn">Send Login Code</button>
    <button id="payBtn" class="secondary-btn">Buy Full Course</button>
  </div>

  <script type="module">
    import { requestOTP, verifyOTPAndLogin } from "./auth.js";
    import { handlePaymentCheckout } from "./checkout.js";

    const EMAIL_INPUT = document.getElementById("emailInput");
    const OTP_INPUT = document.getElementById("otpInput");
    const OTP_GROUP = document.getElementById("otpGroup");
    const MAIN_BTN = document.getElementById("mainBtn");
    const PAY_BTN = document.getElementById("payBtn");
    const ERR_MSG = document.getElementById("errorMessage");

    let STEP = "EMAIL";

    MAIN_BTN.addEventListener("click", async () => {
      ERR_MSG.style.display = "none";
      const EMAIL = EMAIL_INPUT.value.trim();

      if (STEP === "EMAIL") {
        try {
          MAIN_BTN.disabled = true;
          MAIN_BTN.innerText = "Sending code...";
          await requestOTP(EMAIL);
          
          OTP_GROUP.style.display = "block";
          EMAIL_INPUT.disabled = true;
          MAIN_BTN.innerText = "Verify & Access";
          MAIN_BTN.disabled = false;
          STEP = "OTP";
        } catch (ERR) {
          ERR_MSG.innerText = ERR.message;
          ERR_MSG.style.display = "block";
          MAIN_BTN.disabled = false;
          MAIN_BTN.innerText = "Send Login Code";
        }
      } else if (STEP === "OTP") {
        try {
          MAIN_BTN.disabled = true;
          MAIN_BTN.innerText = "Verifying...";
          const CODE = OTP_INPUT.value.trim();
          await verifyOTPAndLogin(EMAIL, CODE);
        } catch (ERR) {
          ERR_MSG.innerText = ERR.message;
          ERR_MSG.style.display = "block";
          MAIN_BTN.disabled = false;
          MAIN_BTN.innerText = "Verify & Access";
        }
      }
    });

    PAY_BTN.addEventListener("click", () => {
      const EMAIL = EMAIL_INPUT.value.trim();
      handlePaymentCheckout(EMAIL);
    });
  </script>
</body>
</html>
