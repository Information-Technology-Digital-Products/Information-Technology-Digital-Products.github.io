<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouOmni Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 22px;
    }

    .block {
      border: 1px solid #3a3a3a;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #181818;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2a2a2a;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #4a90e2;
      color: white;
    }

    .google {
      background: white;
      color: black;
    }

    .toggle-text {
      text-align: center;
      font-size: 13px;
      color: #aaa;
      margin-top: 4px;
    }

    .toggle-link {
      color: #4a90e2;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1 id="form-title">LOG IN</h1>

    <div class="block">
      <button id="google-btn" class="google">Log in with Google</button>
    </div>

    <div class="block">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="email-btn" class="primary">Log in with Email</button>
      
      <div class="toggle-text">
        <span id="toggle-label">Don't have an account?</span>
        <span id="toggle-btn" class="toggle-link">Sign Up</span>
      </div>
    </div>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithPopup, 
    GoogleAuthProvider,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDynBXFEWiPQn1ggxgzCsSocnHPXCOnhd8",
    authDomain: "youomni-7e3b8.firebaseapp.com",
    projectId: "youomni-7e3b8",
    storageBucket: "youomni-7e3b8.firebasestorage.app",
    messagingSenderId: "349979735697",
    appId: "1:349979735697:web:aa49de6fdd07b40cdff130",
    measurementId: "G-C1GVBRZZN3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let isSignUpMode = false;

  const formTitle = document.getElementById("form-title");
  const emailBtn = document.getElementById("email-btn");
  const toggleLabel = document.getElementById("toggle-label");
  const toggleBtn = document.getElementById("toggle-btn");

  // Toggle between Log In and Sign Up modes
  toggleBtn.addEventListener("click", () => {
    isSignUpMode = !isSignUpMode;
    if (isSignUpMode) {
      formTitle.innerText = "SIGN UP";
      emailBtn.innerText = "Sign up with Email";
      toggleLabel.innerText = "Already have an account?";
      toggleBtn.innerText = "Log In";
    } else {
      formTitle.innerText = "LOG IN";
      emailBtn.innerText = "Log in with Email";
      toggleLabel.innerText = "Don't have an account?";
      toggleBtn.innerText = "Sign Up";
    }
  });

  function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect");
    window.location.href = redirect || "https://youomni.github.io";
  }

  // Google Sign-In
  document.getElementById("google-btn").addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, provider);
      redirectAfterLogin();
    } catch (error) {
      console.error("Google Auth Error:", error);
      alert("Google login failed: " + error.message);
    }
  });

  // Email + Password Submission
  emailBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Please enter both email and password.");
      return;
    }

    if (isSignUpMode) {
      // Create New Account
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        redirectAfterLogin();
      } catch (error) {
        if (error.code === "auth/email-already-in-use") {
          alert("This email is already registered. Please switch to Log In.");
        } else if (error.code === "auth/weak-password") {
          alert("Password should be at least 6 characters.");
        } else {
          alert("Sign up failed: " + error.message);
        }
      }
    } else {
      // Log In Existing User
      try {
        await signInWithEmailAndPassword(auth, email, password);
        redirectAfterLogin();
      } catch (error) {
        if (error.code === "auth/invalid-credential" || error.code === "auth/user-not-found" || error.code === "auth/wrong-password") {
          alert("Incorrect email or password. If you don't have an account yet, click 'Sign Up' below.");
        } else {
          alert("Login failed: " + error.message);
        }
      }
    }
  });
</script>

</body>
</html>
